name: release

on:
  release:
    types: [published]

jobs:
  publish-rubygems:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Install dependencies
        run: bundle install

      - name: Run tests
        run: bundle exec rake spec

      - name: Build gem
        run: gem build payjpv2.gemspec

      - name: Get version from release tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Verify gem version matches tag
        run: |
          GEM_VERSION=$(ruby -r ./lib/payjpv2/version -e "puts PAYJPv2::VERSION")
          TAG_VERSION=${{ steps.version.outputs.version }}
          if [ "$GEM_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: Gem version ($GEM_VERSION) does not match tag version ($TAG_VERSION)"
            exit 1
          fi

      - name: Publish to RubyGems
        uses: rubygems/release-gem@v1
